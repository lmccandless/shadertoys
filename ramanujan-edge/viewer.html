<script id="shader-json" type="application/json">{"ver":"0.1","info":{"id":"","date":"0","viewed":0,"name":"Ramanujan: The Crown and the Edge","description":"The Hardy-Ramanujan circle method as a 3D crown of singularities over the unit disk, diving into an endless, exactly self-similar modular zoom at the golden point e^(2 pi i/phi). Drag horizontally to scrub.","likes":0,"published":"Private","usePreview":0,"tags":["ramanujan","modular","fordcircles","infinitezoom","raymarching"],"hasliked":0,"parentid":"","parentname":""},"renderpass":[{"inputs":[{"id":"4dXGR8","filepath":"/media/previz/buffer00.png","type":"buffer","channel":0,"sampler":{"filter":"nearest","wrap":"clamp","vflip":"true","srgb":"false","internal":"byte"},"published":1}],"outputs":[{"id":"4dXGR8","channel":0}],"code":"// RAMANUJAN: THE CROWN AND THE EDGE (lite)\n// ----------------------------------------------------------------------------\n// 0-24 s   the circle method: (1-|q|) log|P(q)| over the unit disk, where\n//          P(q) = sum p(n) q^n = prod 1/(1-q^n) = q^(1/24)/eta(tau).\n//          Every root of unity e^(2 pi i h/k) is a singularity; its lobe (a Ford\n//          circle) rises to 1/k. The camera dives onto the golden point.\n// 24-46 s  the edge: an endless zoom into q = e^(2 pi i/phi). M = (2 1; 1 1)\n//          fixes tau = phi and is an exact dilation in sigma = (tau-phi)/(tau+1/phi);\n//          everything drawn is SL2(Z)-invariant, so the zoom loops seamlessly\n//          and never runs out of precision.\n// Drag horizontally to scrub.\n//\n// Buffer A: scene (HDR); alpha of texel (0,0) holds the clock. iChannel0 = Buffer A (self). Kept small for fast compiles: the modular reduction is\n// inlined at three call sites only (raymarch+bisection share one loop, normals\n// and the edge's three samples are loops too).\n\nconst float PI = 3.14159265, TAU = 6.28318531, PHI = 1.61803399;\nconst float LOOP = 46.0, EDGE_T = 24.0, FADE = 2.4;\nconst vec3 GOLD = vec3(1.0, 0.66, 0.24), SAFFRON = vec3(1.0, 0.42, 0.1);\nfloat PX;\n\nfloat ease(float x) { x = clamp(x, 0.0, 1.0); return x * x * (3.0 - 2.0 * x); }\nvec2 cmul(vec2 a, vec2 b) { return vec2(a.x * b.x - a.y * b.y, a.x * b.y + a.y * b.x); }\nvec2 cdiv(vec2 a, vec2 b) { return vec2(a.x * b.x + a.y * b.y, a.y * b.x - a.x * b.y) / dot(b, b); }\n\n// ---- modular reduction: tau -> tau0 in the fundamental domain, g.tau = tau0.\n// The cusp owning tau is -d/c (k = |c|); tau is in its Ford circle iff Im tau0 >= 1.\nvec2 G_T0; vec4 G_G;\nvoid reduceTau(vec2 tau) {\n    vec4 g = vec4(1, 0, 0, 1);\n    for (int i = 0; i \u003c 48; i++) {\n        float n = floor(tau.x + 0.5);\n        tau.x -= n; g.xy -= n * g.zw;\n        float r2 = dot(tau, tau);\n        if (r2 >= 1.0) break;\n        tau = vec2(-tau.x, tau.y) / r2;\n        g = vec4(-g.zw, g.xy);\n    }\n    G_T0 = tau; G_G = g;\n}\n\n// cusp colours cycle once per factor phi^2 in k, matching one zoom step\nvec3 cuspColor(float k) {\n    float s = fract(log(max(k, 1.0)) / 0.962424) * 5.0;\n    vec3 c = mix(GOLD * 1.1, SAFFRON, smoothstep(0.0, 1.0, s));\n    c = mix(c, vec3(0.88, 0.08, 0.13), smoothstep(1.0, 2.0, s));\n    c = mix(c, vec3(0.42, 0.1, 0.62), smoothstep(2.0, 3.0, s));\n    c = mix(c, vec3(0.05, 0.65, 0.72), smoothstep(3.0, 4.0, s));\n    return mix(c, GOLD * 1.1, smoothstep(4.0, 5.0, s));\n}\n\n// ---- shared timing: exponential dive, continued by the zoom\nconst float DIVE = 0.45, KLOG = 1.9248473;          // 4 log phi = log-zoom of one M step\nfloat diveH(float u) { return 0.62 * exp(-DIVE * (u - 18.5)); }\nfloat edgeZoom(float u) {\n    float a = clamp((u - 3.0) / 6.0, 0.0, 1.0);\n    return DIVE * u + 0.9 * (6.0 * (a * a * a - 0.5 * a * a * a * a) + max(u - 9.0, 0.0));\n}\n\n// ============================================================================\n//  the crown\n// ============================================================================\nfloat gH;      // relief scale (flattens during the dive)\nfloat gY;      // Im tau = normalize(ta - ro);\n    if (abs(dot(fw, up)) > 0.999) up = vec3(0, 0, 1);\n    vec3 rt = normalize(cross(fw, up)), uw = cross(rt, fw);\n    vec3 rd = normalize(uv.x * rt + uv.y * uw + 1.6 * fw);\n    float pixAng = PX / 1.6;\n    vec3 col = sky(rd);\n\n    // dark floor beyond the rim\n    float tf = (-0.02 - ro.y) / rd.y;\n    if (tf > 0.0) {\n        float rr = length((ro + rd * tf).xz);\n        if (rr > 1.0) col = mix(vec3(0.004, 0.004, 0.01) + GOLD * 0.05 * exp(-(rr - 1.0) * 25.0), col, smoothstep(2.0, 6.0, tf));\n    }\n\n    // bounds: cylinder r \u003c= 1 and slab of the relief\n    float tmin = -1e9, tmax = 1e9;\n    float A = dot(rd.xz, rd.xz), B = dot(ro.xz, rd.xz), C = dot(ro.xz, ro.xz) - 1.0;\n    float disc = B * B - A * C;\n    if (A > 1e-8) {\n        if (disc \u003c 0.0) tmax = -1.0;\n        else { tmin = (-B - sqrt(disc)) / A; tmax = (-B + sqrt(disc)) / A; }\n    }\n    float s0 = (-0.12 * gH - 1e-3 - ro.y) / rd.y, s1 = (1.05 * gH + 1e-3 - ro.y) / rd.y;\n    tmin = max(max(tmin, min(s0, s1)), 0.0);\n    tmax = min(tmax, max(s0, s1));\n\n    // one loop does both the march and the bisection (one crownL call site)\n    bool hit = false, wall = false, refine = false;\n    float t = tmin, tPrev = tmin, lo = 0.0, hi = 0.0, L = 0.0, yMin = 0.0;\n    int nr = 0;\n    vec3 p = ro;\n    if (tmin \u003c tmax) for (int i = 0; i \u003c 200; i++) {\n        float tt = refine ? 0.5 * (lo + hi) : t;\n        p = ro + rd * tt;\n        if (!refine) yMin = 1.2 * tt * pixAng / TAU;\n        float r = length(p.xz);\n        L = crownL(p.xz, yMin);\n        float d = p.y - heightOf(L, r);\n        if (refine) {\n            if (d \u003c 0.0) hi = tt; else lo = tt;\n            if (++nr == 6) { t = hi; hit = true; break; }\n        } else if (d \u003c 0.0) {\n            if (i == 0 && r > 0.999) { wall = true; break; }\n            refine = true; lo = tPrev; hi = t;\n        } else {\n            tPrev = t;\n            t += max(d * 0.45 * mix(0.25, 1.0, smoothstep(0.02, 0.25, 1.0 - r)), 0.6 * tt * pixAng);\n            if (t > tmax) break;\n        }\n    }\n\n    if (wall) {\n        col = vec3(0.02, 0.015, 0.03) + GOLD * (0.08 + 0.5 * pow(clamp(p.y / max(gH, 1e-3), 0.0, 1.0), 6.0));\n    } else if (hit) {\n        float fp = t * pixAng, r = length(p.xz), y = gY;\n        vec2 t0 = G_T0; float k = abs(G_G.z);\n        float h0 = heightOf(L, r);\n        // forward-difference normal (one more call site)\n        float e = max(1.5 * fp, 1e-4);\n        vec2 hd;\n        for (int j = 0; j \u003c 2; j++) {\n            vec2 o = j == 0 ? vec2(e, 0.0) : vec2(0.0, e);\n            hd[j] = heightOf(crownL(p.xz + o, yMin), length(p.xz + o)) - h0;\n        }\n        vec3 nor = normalize(vec3(-hd.x, e, -hd.y));\n        vec3 kc = cuspColor(k);\n        float lobe = smoothstep(-0.002, 0.02, L);\n        vec3 alb = mix(vec3(0.016, 0.018, 0.05) + kc * 0.07, kc * 0.55, lobe);\n        vec3 ld = normalize(vec3(-0.4, 0.75, 0.55));\n        vec3 cc = alb * (0.08 + 0.95 * max(dot(nor, ld), 0.0));\n        cc += mix(vec3(0.25, 0.3, 0.5), kc, lobe) * pow(max(dot(nor, normalize(ld - rd)), 0.0), mix(24.0, 80.0, lobe)) * mix(0.25, 1.0, lobe);\n        cc += sky(reflect(rd, nor)) * pow(1.0 - max(dot(nor, -rd), 0.0), 4.0) * 1.5;\n        cc += kc * 1.8 * pow(clamp(L * k * k, 0.0, 1.0), 5.0) * lobe;          // glowing tips\n        float cell = TAU * r * y;                                               // one hyperbolic unit\n        cc += mix(GOLD, kc, 0.3) * 0.6 * smoothstep(1.6 * fp, 0.4 * fp, abs(length(t0) - 1.0) / t0.y * cell)\n            * smoothstep(3.0 * fp, 12.0 * fp, cell * 0.3);                     // Ford-domain edges\n        float lj = log2(max(t0.y, 1e-6));\n        cc += kc * 0.35 * smoothstep(1.4 * fp, 0.3 * fp, abs(lj - floor(lj + 0.5)) * 0.693 * cell)\n            * smoothstep(4.0 * fp, 16.0 * fp, cell * 0.69) * step(1.0, t0.y) * lobe;   // horocycles\n        cc += kc * 0.05 * (1.0 - lobe);\n        col = mix(cc, col, smoothstep(3.0, 7.0, t));\n    }\n    // the unit circle\n    float tc = -ro.y / rd.y;\n    if (tc > 0.0 && (!hit || tc \u003c t + 0.02))\n        col += GOLD * 0.9 * smoothstep(2.0 * tc * pixAng, 0.3 * tc * pixAng, abs(length((ro + rd * tc).xz) - 1.0));\n    return col;\n}\n\n// ============================================================================\n//  the edge\n// ============================================================================\nvec3 edge(vec2 uv, float u) {\n    float z = edgeZoom(u);\n    float Sf = diveH(24.0) / (TAU * 1.6) * exp(-fract(z / KLOG) * KLOG);\n    float lobeY = mix(8.7, 1.0, ease((u - 2.0) / 4.5));\n    float relief = ease((u - 3.0) / 4.0);\n\n    // three samples (pixel, +x, +y) in one loop; sample 0 is kept for shading\n    vec2 t0 = vec2(0.0); float k = 1.0, cell = 1.0, Z0 = 0.0; vec2 gr = vec2(0.0);\n    bool mirror = false;\n    for (int s = 0; s \u003c 3; s++) {\n        vec2 o = s == 0 ? vec2(0.0) : s == 1 ? vec2(PX, 0.0) : vec2(0.0, PX);\n        vec2 sig = (uv + o) * Sf / sqrt(5.0);\n        vec2 om = vec2(1, 0) - sig;\n        vec2 d = cdiv(sig * sqrt(5.0), om);            // tau - phi\n        bool mi = d.y \u003c 0.0;\n        vec2 tau = vec2(PHI - 2.0 + d.x, max(abs(d.y), 1e-9));\n        reduceTau(tau);\n        float cp = tau.y * dot(om, om) / (PX * Sf);     // pixels per hyperbolic unit\n        float Z = cp * sqrt(max(G_T0.y / lobeY - 1.0, 0.0));\n        if (s == 0) { t0 = G_T0; k = abs(G_G.z); cell = cp; Z0 = Z; mirror = mi; }\n        else if (abs(G_G.z) == k) gr[s - 1] = Z - Z0;\n        if (s == 0 && (relief \u003c= 0.0 || G_T0.y \u003c lobeY)) break;\n    }\n    float y0 = t0.y;\n    vec3 kc = cuspColor(k);\n    float lobe = smoothstep(-0.8, 0.8, log(y0 / lobeY) * cell);\n    vec3 nor = normalize(vec3(-gr * (mirror ? vec2(1, -1) : vec2(1)) * relief * 0.9, 1.0));\n\n    vec3 alb = mix(vec3(0.016, 0.018, 0.05) + kc * 0.07, kc * 0.55, lobe);\n    vec3 ld = normalize(vec3(-0.45, 0.55, 0.7));\n    vec3 c = alb * (0.08 + 0.95 * max(dot(nor, ld), 0.0)) * mix(1.0, 1.25, relief * lobe);\n    c += mix(vec3(0.25, 0.3, 0.5), kc, lobe) * pow(max(dot(nor, normalize(ld + vec3(0, 0, 1))), 0.0), mix(24.0, 80.0, lobe))\n       * mix(0.25, 1.0, lobe) * mix(0.35, 1.0, relief);\n    c += kc * 0.5 * pow(1.0 - nor.z, 2.0) * lobe * relief;                    // rim light on domes\n    c += kc * 1.8 * pow(clamp(1.0 - lobeY / y0, 0.0, 1.0), 5.0) * lobe;       // glow at the cusps\n    c += mix(GOLD, kc, 0.3) * 0.6 * smoothstep(1.6, 0.4, abs(length(t0) - 1.0) / y0 * cell) * smoothstep(3.0, 12.0, cell * 0.3);\n    float lj = log2(y0);\n    c += kc * 0.35 * smoothstep(1.4, 0.3, abs(lj - floor(lj + 0.5)) * 0.693 * cell) * smoothstep(4.0, 16.0, cell * 0.69) * step(1.0, y0) * lobe;\n    c += kc * 0.05 * (1.0 - lobe);\n    c = mix(mix(GOLD, SAFFRON, 0.4) * 0.35, c, smoothstep(0.6, 3.0, cell));  // sub-pixel haze\n    if (mirror) c *= 0.16 * smoothstep(1.0, 4.0, u) * exp(-abs(uv.y) * 3.0);\n    float dl = abs(uv.y) / PX;\n    return c + GOLD * (1.1 * smoothstep(1.6, 0.3, dl) + 0.25 * exp(-dl * 0.08));\n}\n\nvoid mainImage(out vec4 O, in vec2 fc) {\n    PX = 1.0 / iResolution.y;\n    vec2 uv = (fc - 0.5 * iResolution.xy) * PX;\n    // the clock lives in the alpha of texel (0,0), so scrubbing sticks\n    float T = iFrame == 0 ? 0.0 : texelFetch(iChannel0, ivec2(0), 0).a + clamp(iTimeDelta, 0.0, 0.1);\n    if (iMouse.z > 0.0) T = clamp(iMouse.x / iResolution.x, 0.0, 0.9999) * LOOP;\n    T = mod(T, LOOP);\n    float wc = smoothstep(0.0, 1.5, T) * (1.0 - smoothstep(EDGE_T, EDGE_T + FADE, T));\n    float we = smoothstep(EDGE_T, EDGE_T + FADE, T) * (1.0 - smoothstep(LOOP - 2.0, LOOP - 0.1, T));\n    vec3 col = vec3(0.0);\n    if (wc > 0.0) col += wc * crown(uv, T);\n    if (we > 0.0) col += we * edge(uv, T - EDGE_T);\n    O = vec4(max(col, 0.0), T);\n}\n","name":"Buffer A","description":"","type":"buffer"},{"inputs":[{"id":"4dXGR8","filepath":"/media/previz/buffer00.png","type":"buffer","channel":0,"sampler":{"filte out vec4 st_FragColor;
`;
const HEADER_LINES = HEADER.split('\n').length - 1;

const VS = `#version 300 es
in vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }`;

let state = null;   // { passes, targets, ... }
let time = 0, frame = 0, playing = !manual, lastNow = 0, fpsAcc = 0, fpsN = 0, fps = 0;
const mouse = [0, 0, 0, 0];
let mouseDown = false, clickFresh = false;

function compile(type, src, label, commonLines) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s) || '';
    // Map line numbers back to the pass (or Common) source.
    const mapped = log.replace(/ERROR: 0:(\d+):/g, (_, n) => {
      let line = +n - HEADER_LINES;
      if (line <= commonLines) return `ERROR: Common:${line}:`;
      return `ERROR: ${label}:${line - commonLines}:`;
    });
    throw new Error(`[${label}] compile failed\n${mapped}`);
  }
  return s;
}

function program(fsSrc, label, commonLines) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VS, 'vertex', 0));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc, label, commonLines));
  gl.bindAttribLocation(p, 0, 'p');
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(`[${label}] link failed\n${gl.getProgramInfoLog(p)}`);
  const u = {};
  for (const n of ['iResolution', 'iTime', 'iMouse', 'iDate', 'iSampleRate', 'iFrame', 'iTimeDelta', 'iFrameRate',
                   'iChannelResolution', 'iChannelTime', 'iChannel0', 'iChannel1', 'iChannel2', 'iChannel3'])
    u[n] = gl.getUniformLocation(p, n);
  return { p, u };
}

function makeTarget(w, h) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  const levels = 1 + Math.floor(Math.log2(Math.max(w, h)));
  gl.texStorage2D(gl.TEXTURE_2D, levels, FMT.internal, w, h);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { t, fb, w, h };
}

function samplerFor(s) {
  const smp = gl.createSampler();
  const f = s && s.filter || 'linear';
  const wrap = s && s.wrap === 'repeat' ? gl.REPEAT : gl.CLAMP_TO_EDGE;
  gl.samplerParameteri(smp, gl.TEXTURE_WRAP_S, wrap);
  gl.samplerParameteri(smp, gl.TEXTURE_WRAP_T, wrap);
  gl.samplerParameteri(smp, gl.TEXTURE_MAG_FILTER, f === 'nearest' ? gl.NEAREST : gl.LINEAR);
  gl.samplerParameteri(smp, gl.TEXTURE_MIN_FILTER,
    f === 'nearest' ? gl.NEAREST : f === 'mipmap' ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR);
  return smp;
}

// Media textures: only what the page embeds (e.g. a stand-in font atlas).
const MEDIA = JSON.parse(document.getElementById('media-json').textContent) || {};
const mediaCache = {};
function mediaTexture(filepath, sampler) {
  const key = filepath + JSON.stringify(sampler || {});
  if (mediaCache[key]) return mediaCache[key];
  const url = MEDIA[filepath];
  if (!url) { fail(`no local copy of texture ${filepath}`); return null; }
  const t = { tex: gl.createTexture(), w: 1, h: 1, ready: false };
  gl.bindTexture(gl.TEXTURE_2D, t.tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(4));
  const img = new Image();
  img.onload = () => {
    gl.bindTexture(gl.TEXTURE_2D, t.tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, sampler && sampler.vflip === 'true');
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    t.w = img.width; t.h = img.height; t.ready = true;
  };
  img.src = url;
  return (mediaCache[key] = t);
}

function load(json) {
  errBox.textContent = ''; errBox.style.display = 'none';
  const sh = json.Shader || json;
  document.getElementById('title').textContent = sh.info && sh.info.name || '';
  document.title = (sh.info && sh.info.name) || 'Shader Viewer';
  const common = sh.renderpass.find((r) => r.type === 'common');
  const commonCode = common ? common.code + '\n' : '';
  const commonLines = commonCode ? commonCode.split('\n').length - 1 : 0;
  const order = ['Buffer A', 'Buffer B', 'Buffer C', 'Buffer D', 'Image'];
  const passes = [];
  for (const rp of sh.renderpass) {
    if (rp.type !== 'buffer' && rp.type !== 'image') continue;
    const outId = rp.outputs && rp.outputs[0] && rp.outputs[0].id;
    const target = rp.type === 'image' ? -1 : BUFFER_IDS[outId];
    const isImage = rp.type === 'image';
    const src = HEADER + commonCode + rp.code + `
void main() {
  vec4 c = vec4(0.0, 0.0, 0.0, 1.0);
  mainImage(c, gl_FragCoord.xy);
  ${isImage ? 'c.w = 1.0;' : ''}
  st_FragColor = c;
}`;
    const prog = program(src, rp.name, commonLines);
    const inputs = (rp.inputs || []).map((inp) => ({
      channel: inp.channel,
      buffer: inp.type === 'buffer' || inp.ctype === 'buffer' ? BUFFER_IDS[inp.id] ?? null : null,
      texture: inp.type === 'texture' || inp.ctype === 'texture' ? mediaTexture(inp.filepath || inp.src, inp.sampler) : null,
      filter: inp.sampler && inp.sampler.filter,
      sampler: samplerFor(inp.sampler),
    }));
    for (const inp of inputs) if (inp.buffer === null && !inp.texture) fail(`[${rp.name}] unsupported input on channel ${inp.channel}`);
    passes.push({ name: rp.name, prog, inputs, target, rank: order.indexOf(rp.name) });
  }
  passes.sort((a, b) => a.rank - b.rank);
  const mipBuffers = new Set();
  for (const p of passes) for (const i of p.inputs) if (i.filter === 'mipmap' && i.buffer !== null) mipBuffers.add(i.buffer);
  if (state) freeTargets();
  state = { passes, mipBuffers, targets: [], w: 0, h: 0 };
  restart();
}

function freeTargets() {
  for (const pair of state.targets) for (const t of pair) { gl.deleteTexture(t.t); gl.deleteFramebuffer(t.fb); }
  state.targets = [];
}

function resize() {
  const scale = +document.getElementById('scale').value;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round((params.get('w') || canvas.clientWidth * dpr) * (params.get('w') ? 1 : scale)));
  const h = Math.max(1, Math.round((params.get('h') || canvas.clientHeight * dpr) * (params.get('h') ? 1 : scale)));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  if (!state || (state.w === w && state.h === h)) return;
  // Reallocate buffers, preserving their contents like Shadertoy does.
  const old = state.targets, oldCur = state.cur;
  state.targets = [0, 1, 2, 3].map(() => [makeTarget(w, h), makeTarget(w, h)]);
  state.cur = [0, 0, 0, 0];
  if (old.length) {
    for (let b = 0; b < 4; b++) {
      const src = old[b][oldCur[b]];
      gl.bindFramebuffer(gl.READ_FRAMEBUFFER, src.fb);
      gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, state.targets[b][0].fb);
      gl.blitFramebuffer(0, 0, src.w, src.h, 0, 0, Math.min(src.w, w), Math.min(src.h, h),
                         gl.COLOR_BUFFER_BIT, gl.NEAREST);
      for (const t of old[b]) { gl.deleteTexture(t.t); gl.deleteFramebuffer(t.fb); }
    }
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
  }
  state.w = w; state.h = h;
}

function restart() {
  time = 0; frame = 0;
  if (!state) return;
  freeTargets();
  state.w = state.h = 0;
  resize();
}

const quad = gl && gl.createBuffer();
if (gl) {
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
}

function renderFrame(dt, only) {
  if (!state) return;
  resize();
  const { w, h } = state;
  const now = new Date();
  const date = [now.getFullYear(), now.getMonth(), now.getDate(),
                now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds() + now.getMilliseconds() / 1000];
  for (const pass of state.passes) {
    if (only && !only.includes(pass.name)) continue;
    const { p, u } = pass.prog;
    gl.useProgram(p);
    const texUnits = [];
    for (let ch = 0; ch < 4; ch++) {
      const inp = pass.inputs.find((i) => i.channel === ch);
      gl.activeTexture(gl.TEXTURE0 + ch);
      if (inp && inp.texture) {
        gl.bindTexture(gl.TEXTURE_2D, inp.texture.tex);
        gl.bindSampler(ch, inp.sampler);
        texUnits.push(inp.texture.w, inp.texture.h, 1);
      } else if (inp && inp.buffer !== null) {
        const b = inp.buffer;
        gl.bindTexture(gl.TEXTURE_2D, state.targets[b][state.cur[b]].t);
        gl.bindSampler(ch, inp.sampler);
        texUnits.push(w, h, 1);
      } else {
        gl.bindTexture(gl.TEXTURE_2D, null);
        gl.bindSampler(ch, null);
        texUnits.push(0, 0, 0);
      }
      gl.uniform1i(u['iChannel' + ch], ch);
    }
    gl.uniform3f(u.iResolution, w, h, 1);
    gl.uniform1f(u.iTime, time);
    gl.uniform1f(u.iTimeDelta, dt);
    gl.uniform1f(u.iFrameRate, dt > 0 ? 1 / dt : 60);
    gl.uniform1i(u.iFrame, frame);
    gl.uniform4f(u.iMouse, mouse[0], mouse[1], mouse[2], mouse[3]);
    gl.uniform4f(u.iDate, date[0], date[1], date[2], date[3]);
    gl.uniform1f(u.iSampleRate, 44100);
    gl.uniform3fv(u.iChannelResolution, texUnits);
    gl.uniform1fv(u.iChannelTime, [time, time, time, time]);
    let dst = null;
    if (pass.target >= 0) {
      const b = pass.target;
      const next = 1 - state.cur[b];
      dst = state.targets[b][next];
      gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb);
    } else {
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    }
    gl.viewport(0, 0, w, h);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (pass.target >= 0) {
      const b = pass.target;
      state.cur[b] = 1 - state.cur[b];
      if (state.mipBuffers.has(b)) {
        gl.bindTexture(gl.TEXTURE_2D, dst.t);
        gl.generateMipmap(gl.TEXTURE_2D);
      }
    }
  }
  for (let ch = 0; ch < 4; ch++) gl.bindSampler(ch, null);
  frame++;
  time += dt;
  if (mouse[3] > 0) mouse[3] = -mouse[3];
}

function tick(nowMs) {
  const now = nowMs / 1000;
  const dt = lastNow ? Math.min(now - lastNow, 0.1) : 1 / 60;
  lastNow = now;
  if (playing) {
    try { renderFrame(dt); } catch (e) { fail(String(e)); playing = false; }
    fpsAcc += dt; fpsN++;
    if (fpsAcc > 0.5) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
  }
  document.getElementById('stats').textContent =
    `${time.toFixed(2)}s  ${fps.toFixed(0)} fps  ${canvas.width}×${canvas.height}`;
  requestAnimationFrame(tick);
}

// Shadertoy mouse convention: xy = current position while held, zw = click
// position; z < 0 after release, w < 0 after the click frame.
function setMouse(x, y, down) {
  if (down && !mouseDown) { mouse[2] = x; mouse[3] = y; }
  if (down) { mouse[0] = x; mouse[1] = y; }
  if (!down && mouseDown) { mouse[2] = -Math.abs(mouse[2]); }
  mouseDown = down;
}
function canvasPos(e) {
  const r = canvas.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width * canvas.width, (1 - (e.clientY - r.top) / r.height) * canvas.height];
}
canvas.addEventListener('pointerdown', (e) => { canvas.setPointerCapture(e.pointerId); setMouse(...canvasPos(e), true); });
canvas.addEventListener('pointermove', (e) => { if (mouseDown) setMouse(...canvasPos(e), true); });
canvas.addEventListener('pointerup', (e) => setMouse(...canvasPos(e), false));

const playBtn = document.getElementById('play');
function setPlaying(v) { playing = v; playBtn.textContent = v ? '❚❚' : '▶'; }
playBtn.onclick = () => setPlaying(!playing);
document.getElementById('restart').onclick = restart;
document.getElementById('scale').onchange = () => { if (state) resize(); };
document.getElementById('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
document.getElementById('file').onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  try { load(JSON.parse(await f.text())); } catch (err) { fail(String(err)); }
};
window.addEventListener('keydown', (e) => {
  if (e.key === ' ') { setPlaying(!playing); e.preventDefault(); }
  else if (e.key === 'r' || e.key === 'R') restart();
  else if (e.key === 'f' || e.key === 'F') document.getElementById('fs').click();
});
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', async (e) => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f) try { load(JSON.parse(await f.text())); } catch (err) { fail(String(err)); }
});
let idleTimer = 0;
window.addEventListener('pointermove', () => {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add('idle'), 2500);
});

// Hooks for automated rendering (used by tools/render.mjs with ?manual).
window.ST = {
  renderFrames(n, dt = 1 / 60, only) { for (let i = 0; i < n; i++) renderFrame(dt, only); gl.finish(); return { time, frame }; },
  setMouse, restart, load,
  readBuffer(b, x, y, w, h) {
    const t = state.targets[b][state.cur[b]];
    gl.bindFramebuffer(gl.FRAMEBUFFER, t.fb);
    const out = new Float32Array(w * h * 4);
    gl.readPixels(x, y, w, h, gl.RGBA, gl.FLOAT, out);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return Array.from(out);
  },
  get time() { return time; }, get frame() { return frame; },
  errors: () => errBox.textContent,
  mediaReady: () => Object.values(mediaCache).every((t) => t.ready),
};

if (gl) {
  const embedded = JSON.parse(document.getElementById('shader-json').textContent);
  if (embedded) { try { load(embedded); } catch (e) { fail(String(e)); } }
  if (!manual) requestAnimationFrame(tick);
  if (manual) document.getElementById('bar').style.display = 'none';
}
</script>
</body>
</html>
