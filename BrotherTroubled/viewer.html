),f.x),mix(hash12(a+vec2(0,1)),hash12(a+1.0),f.x),f.y);\n    a+=vec2(37,17);\n    float h=mix(mix(hash12(a),hash12(a+vec2(1,0)),f.x),mix(hash12(a+vec2(0,1)),hash12(a+1.0),f.x),f.y);\n    return mix(l,h,f.z);\n}\nfloat smoothMin(float a,float b,float k) {\n    float h=max(k-abs(a-b),0.0)/k; return min(a,b)-h*h*k*0.25;\n}\nfloat smoothMax(float a,float b,float k) { return -smoothMin(-a,-b,k); }\nfloat boxSDF(vec3 p,vec3 b) {\n    vec3 d=abs(p)-b; return length(max(d,0.0))+min(max(d.x,max(d.y,d.z)),0.0);\n}\nfloat ellipsoid(vec3 p,vec3 r) {\n    float k0=length(p/r),k1=length(p/(r*r));\n    return k0*(k0-1.0)/max(k1,0.00001);\n}\n// Linearly tapered capsule (a \"round cone\" with radii ra at a and rb at b).\nfloat taper(vec3 p,vec3 a,vec3 b,float ra,float rb) {\n    vec3 ba=b-a; float t=clamp(dot(p-a,ba)/dot(ba,ba),0.0,1.0);\n    return length(p-a-ba*t)-mix(ra,rb,t);\n}\n// Exact-ish round cone (two spheres joined by a tangent cone): smoother than taper() at the ends.\nfloat roundCone(vec3 p,vec3 a,vec3 b,float r1,float r2) {\n    vec3 ba=b-a; float l2=dot(ba,ba),rr=r1-r2,a2=l2-rr*rr,il2=1.0/l2;\n    vec3 pa=p-a; float y=dot(pa,ba),z=y-l2,x2=dot(pa*l2-ba*y,pa*l2-ba*y);\n    float y2=y*y*l2,z2=z*z*l2,k=sign(rr)*rr*rr*x2;\n    if(sign(z)*a2*z2>k) return sqrt(x2+z2)*il2-r2;\n    if(sign(y)*a2*y2\u003ck) return sqrt(x2+y2)*il2-r1;\n    return (sqrt(x2*a2*il2)+y*rr)*il2-r1;\n}\n// Bent, tapering tube: an arc of radius R that starts at the origin heading +x and curves toward +y\n// through `sweep` radians; the tube radius blends r0 -> r1 along the arc. The tip is a true sphere,\n// so a horn made with it is smooth and round everywhere, with no straight-segment kinks.\nfloat arcTaper(vec3 p,float R,float sweep,float r0,float r1) {\n    float th=clamp(atan(p.x,R-p.y),0.0,sweep);\n    vec3 c=vec3(R*sin(th),R*(1.0-cos(th)),0.0);\n    return length(p-c)-mix(r0,r1,th/sweep);\n}\n// 2D rounded box with a separate radius per corner: r = (top-right, bottom-right, top-left, bottom-lef e: a long, soft plane running from the ear root down to the chin.\n    d=smoothMin(d,roundCone(p,P(200.0,362.0,0.0),P(154.0,380.0,0.0),PX(19.0),PX(8.5)),0.08);\n    // Muzzle pad (broad from the front, as a bovine muzzle is).\n    d=smoothMin(d,ellipsoid(p-P(145.0,373.0,0.0),vec3(PX(11.0),PX(11.5),0.145)),0.06);\n    return d;\n}\nfloat cowLegs(vec3 p) {\n    // Near legs stand at z = +0.5, far legs at z = -0.4: the painted hoof spacing (11 px) needs that\n    // little depth, and the flanks overhang them like a fat animal's should.\n    // near fore: stout forearm, knee, slender cannon, fetlock, short pastern\n    float d=roundCone(p,P(313.0,455.0,0.5),P(314.0,503.0,0.5),PX(19.0),PX(9.6));\n    d=smoothMin(d,roundCone(p,P(314.0,503.0,0.5),P(315.0,532.0,0.5),PX(9.6),PX(6.2)),0.06);\n    d=smoothMin(d,roundCone(p,P(315.0,532.0,0.5),P(316.0,543.0,0.5),PX(6.2),PX(7.2)),0.04);\n    d=smoothMin(d,roundCone(p,P(316.0,543.0,0.5),P(314.0,551.0,0.5),PX(7.2),PX(6.0)),0.03);\n    // far fore\n    d=min(d,roundCone(p,P(284.0,455.0,-0.4),P(283.0,500.0,-0.4),PX(15.0),PX(8.0)));\n    d=smoothMin(d,roundCone(p,P(283.0,500.0,-0.4),P(281.0,531.0,-0.4),PX(8.0),PX(5.6)),0.05);\n    d=smoothMin(d,roundCone(p,P(281.0,531.0,-0.4),P(280.0,544.0,-0.4),PX(5.6),PX(6.2)),0.03);\n    // near hind: heavy gaskin, a distinct hock with its point behind, slim cannon, fetlock\n    d=min(d,roundCone(p,P(562.0,452.0,0.5),P(578.0,500.0,0.5),PX(31.0),PX(14.5)));\n    d=smoothMin(d,ellipsoid(p-P(584.0,503.0,0.5),vec3(PX(11.5),PX(14.0),0.13)),0.05);\n    d=smoothMin(d,roundCone(p,P(580.0,505.0,0.5),P(578.0,540.0,0.5),PX(10.5),PX(6.6)),0.05);\n    d=smoothMin(d,roundCone(p,P(578.0,540.0,0.5),P(578.0,548.0,0.5),PX(6.6),PX(7.6)),0.03);\n    d=smoothMin(d,roundCone(p,P(578.0,548.0,0.5),P(577.0,556.0,0.5),PX(7.6),PX(6.4)),0.03);\n    // far hind: slants back under the body, so the hoof lands left of the thigh\n    d=min(d,roundCone(p,P(536.0,452.0,-0.4),P(530.0,498.0,-0.4),PX(27.0),PX(13.0)));\n    d=smoothMin(d,roundCone(p,P(530.0,498.0,-0.4),P(527.0,530.0,-0.4),PX(13.0),PX(6.4)),0.06);\n    d=smoothMin(d,roundCone(p,P(527.0,530.0,-0.4),P(525.0,546.0,-0.4),PX(6.4),PX(6.6)),0.03);\n    return d;\n}\nfloat cowTail(vec3 p) {\n    // Root sunk into the rump, then a slender rope hanging straight down the rear edge.\n    float d=roundCone(p,P(612.0,338.0,0.0),P(620.0,372.0,0.0),PX(7.5),PX(3.2));\n    d=smoothMin(d,roundCone(p,P(620.0,372.0,0.0),P(620.5,462.0,0.0),PX(3.2),PX(2.7)),0.04);\n    return d;\n}\nfloat cowMass(vec3 p) {\n    // Barrel: the painting's silhouette (x 230..624, y 297..487 px) inflated into a soft slab, so the\n    // outline is exactly the painted one while flanks, back and belly are properly round in depth.\n    vec2 c=P(419.5,392.5,0.0).xy;\n    float d2=roundBox2(p.xy-c,vec2(PX(189.5),PX(94.5)),vec4(PX(30.0),PX(94.0),PX(70.0),PX(46.0)));\n    // The painted rump bulges out above the thigh, then the outline falls back in (623 px -> 614 px).\n    d2=smoothMin(d2,ellipsoid(vec3(p.xy-P(596.0,340.0,0.0).xy,0.0),vec3(PX(28.0),PX(33.0),1.0)),PX(14.0));\n    float d=inflate(d2,p.z,0.84,0.66);\n    // Haunch and shoulder pads give the flank a sculpted, well-fed swell instead of a flat plate.\n    d=smoothMin(d,ellipsoid(p-P(526.0,414.0,0.34),vec3(PX(72.0),PX(90.0),0.58)),0.30);\n    d=smoothMin(d,ellipsoid(p-P(306.0,414.0,0.32),vec3(PX(66.0),PX(84.0),0.56)),0.26);\n    // Brisket / dewlap: the painted chest bulges forward and hangs low in front of the near leg.\n    d=smoothMin(d,ellipsoid(p-P(252.0,440.0,0.0),vec3(PX(34.0),PX(50.0),0.55)),0.16);\n    // Short, thick neck carrying the head just in front of the shoulder.\n    d=smoothMin(d,roundCone(p,P(248.0,360.0,0.0),P(210.0,354.0,0.0),PX(42.0),PX(30.0)),0.14);\n    float hb=length(p-HEAD_C);\n    if(hb\u003c0.78) d=smoothMin(d,cowHead(p),0.08);\n    else d=min(d,hb-0.72);\n    if(p.y\u003c1.45) d=smoothMin(d,cowLegs(p),0.12);\n    if(p.x>1.85 && p.y>0.3) d=smoothMin(d,cowTail(p),0.05);\n    return d;\n}\n"},{"inputs":[{"id":"4dXGR8","filepath":"/media/previz/buffer00.png","type":"buffer","channel":0,"sampler":{"filter":"nearest","wrap":"clamp","vflip":"true","srgb":"false","internal":"byte"},"published":1}],"outputs":[{"id":"4dXGR8","channel":0}],"name":"Buffer A","description":"Camera feedback and cached pigment atlas","type":"buffer","code":"// Camera state + a one-time, seamless multiscale pigment/noise atlas.\n// iChannel0: Buffer A (previous frame).\nfloat periodicNoise(vec2 uv,float cells) {\n    vec2 p=uv*cells,i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);\n    return mix(mix(hash12(mod(i,cells)),hash12(mod(i+vec2(1,0),cells)),f.x),\n               mix(hash12(mod(i+vec2(0,1),cells)),hash12(mod(i+vec2(1,1),cells)),f.x),f.y);\n}\nvoid mainImage(out vec4 O,in vec2 F) {\n    ivec2 ip=ivec2(F);\n    bool valid=isReady(iChannel0,61.25)&&all(equal(ivec2(texelFetch(iChannel0,ivec2(0),0).xy),ivec2(iResolution.xy)));\n    if(ip.y==0 && ip.x\u003c4) {\n        vec4 old=valid?texelFetch(iChannel0,ivec2(1,0),0):vec4(0);\n        vec4 ctrl=valid?texelFetch(iChannel0,ivec2(2,0),0):vec4(iMouse.xy,0,0);\n        vec2 goal=old.zw;\n        float lastPress=valid?texelFetch(iChannel0,ivec2(3,0),0).z:-10.0;\n        bool down=iMouse.z>0.0;\n        if(down && ctrl.z\u003c0.5) {\n            if(valid && iTime-lastPress\u003c0.32) goal=vec2(0);\n            lastPress=iTime;\n        }\n        if(valid && down && ctrl.z>0.5) goal+=(iMouse.xy-ctrl.xy)/iResolution.xy*vec2(0.95,0.78);\n        goal=clamp(goal,vec2(-ORBIT_LIMIT),vec2(ORBIT_LIMIT));\n        float dt=clamp(iTimeDelta,1.0/240.0,1.0/20.0);\n        vec2 angle=mix(old.xy,goal,1.0-exp(-dt*13.0));\n        if(length(angle-goal)\u003c0.00002) angle=goal;\n        float age=(valid && length(angle-old.xy)\u003c0.000002)?ctrl.w+1.0:0.0;\n        if(ip.x==0) O=vec4(iResolution.xy,0,61.25);\n        else if(ip.x==1) O=vec4(angle,goal);\n        else if(ip.x==2) O=vec4(iMouse.xy,down?1.0:0.0,min(age,4096.0));\n        else O=vec4(old.xy,lastPress,0);\n        return;\n    }\n    if(valid) { O=texelFetch(iChannel0,ip,0); return; }\n    vec2 uv=F/iResolution.xy;\n    float n8=periodicNoise(uv,8.0),n16=periodicNoise(uv,16.0);\n    float n32=periodicNoise(uv,32.0),n64=periodicNoise(uv,64.0);\n    float n128=periodicNoise(uv,128.0),n256=periodicNoise(uv,256.0);\n    O=vec4(0.52*n8+0.28*n16+0.14*n32+0.06*n64,\n           0.56*n32+0.28*n64+0.16*n128,\n           0.62*n128+0.38*n256,n256);\n}\n"},{"inputs":[{"id":"4dXGR8","filepath":"/media/previz/buffer00.png","type":"buffer","channel":0,"sampler":{"filter":"linear","wrap":"clamp","vflip":"true","srgb":"false","internal":"byte"},"published":1}],"outputs":[{"id":"XsXGR8","channel":0}],"name":"Buffer B","description":"True 3D anatomy, architecture and botanical geometry","type":"buffer","code":"// Geometry only: the barn, the tree, the distant church and tree line, and the cow.\n// RGB stores octahedral normal.xy + ray distance; A is the material ID.\n// iChannel0: A (current camera/pigment atlas).\n//  ID  0 sky   1 hide   2 ground   3 barn wall   4 oak    5 shutter   6 eye   7 horn   8 hoof\n//      9 muzzle 10 inner ear 11 foliage 13 post  14 church stone 16 tail switch 17 thatch 18 bench\nstruct Hit { float t; vec3 n; float m; };\n\n// ---- cow: fine detail on top of Common's cowMass ------------------------------------------------\nmat3 frameOf(vec3 t,vec3 curl) {\n    t=normalize(t); vec3 n=normalize(curl-dot(curl,t)*t);\n    return mat3(t,n,cross(t,n));\n}\nvec2 cowHeadFine(vec3 p,vec2 res) {\n    // Eye: a socket pressed into the skull, a proud eyeball in it, and a soft lid rim around it.\n    vec3 e=p-P(180.5,341.0,0.235);\n    res.x=smoothMax(res.x,-ellipsoid(e,vec3(PX(8.4),PX(7.2),0.060)),0.018);\n    res=pick(res,vec2(ellipsoid(e-vec3(0.0,0.0,-0.012),vec3(PX(5.4),PX(4.8),0.050)),6.0));\n    // Ears: a leaf of hide leaning up and back from the poll, with a cupped, pinker inside. The lower\n    // end is sunk into the skull and blended with a small radius, so the ear is grown from the head.\n    vec3 ep=p-P(214.0,325.0,0.205); ep.xy=rot(1.02)*ep.xy;\n    ep.xz=rot(-0.30)*ep.xz;\n    float ear=ellipsoid(ep,vec3(0.185,0.082,0.044));\n    float cup=ellipsoid(ep-vec3(0.01,0.0,0.052),vec3(0.135,0.052,0.040));\n    vec3 far=p; far.z=-far.z;\n    vec3 fp=far-P(214.0,325.0,0.205); fp.xy=rot(1.02)*fp.xy; fp.xz=rot(-0.30)*fp.xz;\n    float ear2=ellipsoid(fp,vec3(0.185,0.082,0.044));\n    ear=min(ear,ear2);\n    float earD=max(ear,-cup);\n    bool earWins=earD\u003cres.x;\n    res.x=smoothMin(res.x,earD,0.035);\n    if(earWins && -cup>ear) res.y=10.0;\n    // Poll boss between the horns, and the horns themselves: smooth bent tubes, tapering to a\n    // rounded tip, growing out of the boss (smooth union), never a chain of straight segments.\n    float boss=ellipsoid(p-P(187.0,315.5,0.0),vec3(PX(16.5),PX(8.6),0.165));\n    vec3 hq=p; hq.z=abs(hq.z);\n    vec3 hb=P(197.0,314.5,0.11);\n    mat3 hf=frameOf(vec3(-0.936,-0.10,0.14),vec3(0.0,1.0,-0.05));\n    float horn=arcTaper(transpose(hf)*(hq-hb),0.85,0.68,0.040,0.006);\n    float hornAll=smoothMin(boss,horn,0.05);\n    res=pick(res,vec2(hornAll,7.0));\n    res.x=smoothMin(res.x,hornAll,0.02);\n    return res;\n}\nfloat hoof(vec3 f,vec3 half3) {\n    // Cloven wedge: flat sole, toe (-x) leaning forward, a shallow cleft down the front of the toe.\n    float d=boxSDF(f,half3)-0.020;\n    d=max(d,dot(f.xy,vec2(-0.61,0.79))-half3.y*0.55);\n    float cleft=max(abs(f.z)-0.007,f.x+half3.x*0.15);\n    return max(d,-cleft);\n}\nvec2 cowHooves(vec3 p,vec2 res) {\n    // Cloven hoof wedges: toe forward (-x), always dark against the pale pastern above.\n    res=pick(res,vec2(hoof(p-P(313.0,555.0,0.5),vec3(PX(9.0),PX(5.6),0.085)),8.0));\n    res=pick(res,vec2(hoof(p-P(279.0,546.0,-0.4),vec3(PX(8.0),PX(4.8),0.070)),8.0));\n    res=pick(res,vec2(hoof(p-P(578.0,563.0,0.5),vec3(PX(9.5),PX(5.6),0.090)),8.0));\n    res=pick(res,vec2(hoof(p-P(525.0,553.0,-0.4),vec3(PX(8.5),PX(5.0),0.078)),8.0));\n    return res;\n}\nvec2 cowTuft(vec3 p,vec2 res) {\n    // The switch: a soft, tapering brush of hair below the rope, ending in a wisp (not a blade).\n    float t=roundCone(p,P(620.5,458.0,0.0),P(619.5,482.0,0.0),PX(2.7),PX(4.4));\n    t=smoothMin(t,roundCone(p,P(619.5,482.0,0.0),P(617.5,509.0,0.0),PX(4.4),PX(1.2)),0.03);\n    return pick(res,vec2(t,16.0));\n}\nvec2 cow(vec3 p) {\n    vec2 res=vec2(cowMass(p),1.0);\n    float hb=length(p-HEAD_C);\n    if(hb\u003cHEAD_R) res=cowHeadFine(p,res);\n    else res.x=min(res.x,hb-HEAD_R+0.05);\n    if(p.y\u003c0.3) res=cowHooves(p,res);\n    if(p.x>1.9 && p.y\u003c1.2) res=cowTuft(p,res);\n    return res;\n}\nvec3 cowNormal(vec3 p,float e) {\n    vec3 n=vec3(0);\n    for(int i=ZERO;i\u003c4;i++) {\n        vec3 k=0.5773*vec3(float((((i+3)>>1)&1)*2-1),float(((i>>1)&1)*2-1),float((i&1)*2-1));\n        n+=k*cow(p+k*e).x;\n    }\n    return normalize(n);\n}\n// ---- architecture --------------------------------------------------------------------------------\nvec2 boxInterval(vec3 ro,vec3 rd,vec3 center,vec3 size) {\n    vec3 inv=sign(rd)/max(abs(rd),vec3(0.000001));\n    vec3 a=(center-size-ro)*inv,b=(center+size-ro)*inv;\n    vec3 lo=min(a,b),hi=max(a,b);\n    return vec2(max(lo.x,max(lo.y,lo.z)),min(hi.x,min(hi.y,hi.z)));\n}\nvoid addBox(inout Hit h,vec3 ro,vec3 rd,vec3 center,vec3 size,float mat) {\n    vec2 t=boxInterval(ro,rd,center,size);\n    if(t.x>0.0 && t.x\u003ct.y && t.x\u003ch.t) {\n        vec3 q=(ro+rd*t.x-center)/size,a=abs(q);\n        vec3 n=vec3(0);\n        if(a.x>a.y && a.x>a.z)n.x=sign(q.x);\n        else if(a.y>a.z)n.y=sign(q.y); else n.z=sign(q.z);\n        h=Hit(t.x,n,mat);\n    }\n}\nvoid addEllipsoid(inout Hit h,vec3 ro,vec3 rd,vec3 c,vec3 r,float mat) {\n    vec3 o=(ro-c)/r,d=rd/r;\n    float a=dot(d,d),b=dot(o,d),k=dot(o,o)-1.0,disc=b*b-a*k;\n    if(disc>0.0) {\n        float t=(-b-sqrt(disc))/a;\n        if(t>0.0 && t\u003ch.t)h=Hit(t,normalize((ro+rd*t-c)/(r*r)),mat);\n    }\n}\n// One row of round tree crowns: overlapping half-discs of random height and spacing.\nfloat crownRow(float x,float seed) {\n    float c=x/1.55+seed,i=floor(c),top=0.0;\n    for(int k=-1;k\u003c=1;k++) {\n        float id=i+float(k);\n        float h=0.50+0.50*hash12(vec2(id,seed));\n        float cx=id+0.5+(hash12(vec2(id,seed+5.0))-0.5)*0.45;\n        float w=0.62+0.35*hash12(vec2(id,seed+9.0));\n        top=max(top,h*sqrt(max(0.0,1.0-sq((c-cx)/w))));\n    }\n    return top;\n}\n// Flat cut-out at depth z whose top edge is a row of crowns; used for the far woods.\nvoid addTreeLine(inout Hit h,vec3 ro,vec3 rd,float z,float base,float amp,float freq,float seed,float mat) {\n    if(rd.z>-0.0001) return;\n    float t=(z-ro.z)/rd.z;\n    if(t\u003c=0.0 || t>=h.t) return;\n    vec3 q=ro+rd*t;\n    float x=q.x*freq;\n    float top=base+amp*(0.75*crownRow(x,seed)+0.25*noise2(vec2(x*9.0,seed)));\n    if(q.y\u003ctop && q.y>-0.05) h=Hit(t,normalize(vec3(0.3*(noise2(vec2(x*7.0,1.0))-0.5),0.6*smoothstep(top-0.35,top,q.y),1.0)),mat);\n}\n// A single lumpy crown cut-out standing on the ground at depth z: centre x, half width w, height hgt.\nvoid addCrown(inout Hit h,vec3 ro,vec3 rd,float z,float cx,float w,float hgt,float seed,float mat) {\n    if(rd.z>-0.0001) return;\n    float t=(z-ro.z)/rd.z;\n    if(t\u003c=0.0 || t>=h.t) return;\n    vec3 q=ro+rd*t;\n    vec2 e=vec2((q.x-cx)/w,(q.y-hgt*0.52)/(hgt*0.52));\n    float lump=0.17*(noise2(vec2(q.x*3.1+seed,q.y*3.1))-0.5)+0.09*(noise2(vec2(q.x*9.0+seed,q.y*9.0))-0.5);\n    if(dot(e,e)+lump\u003c1.0 && q.y>-0.05) h=Hit(t,normalize(vec3(e.x*0.5,0.4+0.4*e.y,1.0)),mat);\n}\nfloat thatchSDF(vec3 q) {\n    vec3 c=q-vec3(-1.62,7.30,-0.30);\n    c.xy=rot(0.30)*c.xy;\n    float d=boxSDF(c,vec3(0.58,1.35,2.30))-0.16;\n    return d+0.05*(noise3(q*vec3(6.0,1.6,6.0))-0.5)+0.02*(noise3(q*vec3(21.0,3.0,21.0))-0.5);\n}\nfloat tree(vec3 p) {\n    // Tall, oval elm crown behind the barn corner (painting px 205..295 x 155..300), leaning slightly.\n    p-=P(252.0,232.0,-6.0);\n    float u=PX(1.0)*1.375;\n    float a=ellipsoid(p-vec3(0.0,-3.0*u,0.0),vec3(46.0*u,80.0*u,0.85));\n    float b=ellipsoid(p-vec3(9.0*u,41.0*u,0.05),vec3(30.0*u,42.0*u,0.62));\n    float e=ellipsoid(p-vec3(-4.0*u,-50.0*u,0.0),vec3(52.0*u,50.0*u,0.85));\n    float d=smoothMin(smoothMin(a,b,0.35),e,0.30);\n    d+=0.15*(noise3(p*4.4)-0.5)+0.06*(noise3(p*12.0)-0.5);\n    return d*0.72;\n}\nvec3 treeNormal(vec3 p) {\n    vec2 k=vec2(1,-1)*0.015;\n    return normalize(k.xyy*tree(p+k.xyy)+k.yyx*tree(p+k.yyx)+k.yxy*tree(p+k.yxy)+k.xxx*tree(p+k.xxx));\n}\nvoid mainImage(out vec4 O,in vec2 F) {\n    if(!isReady(iChannel0,61.25)) { O=vec4(0);return; }\n    if(all(equal(ivec2(F),ivec2(0)))) { O=vec4(0,0,0,62.25);return; }\n    vec3 ro;mat3 basis;float focal;\n    camera(texelFetch(iChannel0,ivec2(1,0),0).xy,iResolution.xy,ro,basis,focal);\n    vec3 rd=cameraRay(F+jitter(iFrame),iResolution.xy,basis,focal);\n    Hit h=Hit(600.0,vec3(0,1,0),0.0);\n    if(rd.y\u003c-0.0002) {\n        float t=-ro.y/rd.y;\n        if(t>0.0 && t\u003c92.0) h=Hit(t,vec3(0,1,0),2.0);\n    }\n    // We stand inside the barn, looking out through its open bay: a thatched roof and rafters overhead,\n    // a recessed back wall with its hatch, a heavy bay post with a knee brace, daylight only at the left.\n    float wl=P(330.0,0.0,WALL_Z).x;\n    addBox(h,ro,rd,vec3(wl+5.55,5.6,WALL_Z-0.90),vec3(5.55,5.6,0.90),3.0);\n    addBox(h,ro,rd,vec3(4.60,7.35,-0.60),vec3(6.40,1.10,2.60),17.0);                 // roof, underside at y=6.25\n    for(int k=0;k\u003c6;k++)                                                              // rafters\n        addBox(h,ro,rd,vec3(-0.20+1.90*float(k),6.07,-0.60),vec3(0.13,0.16,2.50),17.0);\n    addBox(h,ro,rd,vec3(4.50,5.95,WALL_Z+0.16),vec3(5.30,0.30,0.16),19.0);           // tie beam on the wall\n    // Bay post (painting px 293..332): a square oak timber from the floor into the roof, and a broad knee brace\n    // that grows out of its upper right, flush with the post's face, and runs up into the roof plate\n    // (centre line 322,176 px -> 372,-20 px). Both share a face plane, so the joint reads as one frame.\n    vec3 pc=P(312.5,150.0,-1.5);\n    addBox(h,ro,rd,vec3(pc.x,3.1,pc.z),vec3(PXZ(19.5,-1.5),3.2,0.22),13.0);\n    vec3 bo=ro-vec3(-0.953,5.533,-1.45),br=rd;bo.xy=rot(-0.2496)*bo.xy;br.xy=rot(-0.2496)*br.xy;\n    Hit brace=Hit(h.t,vec3(0),0.0);\n    addBox(brace,bo,br,vec3(0),vec3(0.18,1.22,0.15),19.0);\n    if(brace.m>0.0) { brace.n.xy=rot(0.2496)*brace.n.xy;h=brace; }\n    // Thatch eave: a rounded, shaggy bundle at the corner of the roof (painting px 250..340 x 0..70).\n    vec2 tb=boxInterval(ro,rd,vec3(-1.62,7.20,-0.30),vec3(0.95,1.80,2.50));\n    if(tb.x\u003ctb.y && tb.x\u003ch.t && tb.y>0.0) {\n        float t=max(tb.x,0.0),endT=min(tb.y,h.t);\n        for(int i=0;i\u003c40;i++) {\n            vec3 q=ro+rd*t;\n            float d=thatchSDF(q);\n            if(d\u003c0.004) {\n                vec3 nn=vec3(0);\n                for(int k=ZERO;k\u003c4;k++) {\n                    vec3 e=0.5773*vec3(float((((k+3)>>1)&1)*2-1),float(((k>>1)&1)*2-1),float((k&1)*2-1));\n                    nn+=e*thatchSDF(q+e*0.02);\n                }\n                h=Hit(t,normalize(normalize(nn)+0.25*(vec3(noise3(q*9.0),noise3(q*9.0+3.0),noise3(q*9.0+7.0))-0.5)),17.0);\n                break;\n            }\n            t+=max(d*0.7,0.01);\n            if(t>endT)break;\n        }\n    }\n    // Hatch in the back wall (painting px 590..690 x 135..265): a timber frame round a dark opening, and the\n    // planked leaf hinged on the left and swung open about 15 degrees toward us.\n    vec3 sc=P(640.0,200.0,WALL_Z+0.05);\n    float fw=PXZ(54.0,WALL_Z),fh=PXZ(69.0,WALL_Z),bt2=PXZ(7.0,WALL_Z),lw=PXZ(46.0,WALL_Z),lh=PXZ(61.0,WALL_Z);\n    addBox(h,ro,rd,sc+vec3(0.0,fh-bt2,0.0),vec3(fw,bt2,0.07),4.0);\n    addBox(h,ro,rd,sc-vec3(0.0,fh-bt2,0.0),vec3(fw,bt2,0.07),4.0);\n    addBox(h,ro,rd,sc-vec3(fw-bt2,0.0,0.0),vec3(bt2,fh,0.07),4.0);\n    addBox(h,ro,rd,sc+vec3(fw-bt2,0.0,0.0),vec3(bt2,fh,0.07),4.0);\n    {\n        const float ca=0.966,sa=0.259;                       // 15 degrees\n        vec3 hinge=sc+vec3(-lw,0.0,0.06);\n        vec3 lo=ro-hinge,ld=rd;\n        lo=vec3(ca*lo.x-sa*lo.z,lo.y,sa*lo.x+ca*lo.z);\n        ld=vec3(ca*ld.x-sa*ld.z,ld.y,sa*ld.x+ca*ld.z);\n        Hit leaf=Hit(h.t,vec3(0),0.0);\n        addBox(leaf,lo,ld,vec3(lw,0.0,0.0),vec3(lw,lh,0.035),5.0);\n        if(leaf.m>0.0) { h=Hit(leaf.t,vec3(ca*leaf.n.x+sa*leaf.n.z,leaf.n.y,-sa*leaf.n.x+ca*leaf.n.z),5.0); }\n    }\n    // A bench against the back wall at the right edge (painting px 700..790 x 400..470).\n    vec3 bt=P(758.0,405.0,-1.55);\n    addBox(h,ro,rd,bt,vec3(PXZ(54.0,-1.55),0.05,0.30),18.0);\n    addBox(h,ro,rd,vec3(bt.x-PXZ(46.0,-1.55),bt.y*0.5,bt.z),vec3(0.05,bt.y*0.5,0.05),18.0);\n    addBox(h,ro,rd,vec3(bt.x+PXZ(46.0,-1.55),bt.y*0.5,bt.z),vec3(0.05,bt.y*0.5,0.05),18.0);\n    // Far woods (low, dark tree lines), the church tower at the end of the lane, and a crown behind the head.\n    addTreeLine(h,ro,rd,-70.0,0.9,1.45,0.62,3.0,11.0);\n    vec3 ch=P(66.0,358.0,-56.0);\n    addBox(h,ro,rd,vec3(ch.x,1.27,ch.z),vec3(0.30,1.27,0.28),14.0);\n    addBox(h,ro,rd,vec3(ch.x,2.62,ch.z),vec3(0.37,0.10,0.34),14.0);\n    for(int k=0;k\u003c4;k++) {\n        float sx=(k&1)==0?-1.0:1.0,sz=(k&2)==0?-1.0:1.0;\n        addBox(h,ro,rd,vec3(ch.x+sx*0.33,2.86,ch.z+sz*0.30),vec3(0.045,0.26,0.045),14.0);\n    }\n    addBox(h,ro,rd,vec3(ch.x-0.70,0.55,ch.z+0.05),vec3(0.55,0.55,0.30),14.0);\n    addTreeLine(h,ro,rd,-48.0,0.35,1.35,0.80,8.0,11.0);\n    // A rounder crown just behind the cow's head (painting px 105..155 x 340..378).\n    vec3 cr=P(130.0,394.0,-40.0);\n    addCrown(h,ro,rd,-40.0,cr.x,PX(27.0)*3.5,PX(58.0)*3.5,2.0,11.0);\n    addCrown(h,ro,rd,-38.0,P(178.0,394.0,-38.0).x,PX(24.0)*3.4,PX(34.0)*3.4,7.0,11.0);\n    // Nearby tree: a stout trunk, then the crown, clipped to a tight bounding box before marching.\n    vec3 tc=P(250.0,232.0,-6.0);\n    addBox(h,ro,rd,vec3(tc.x+0.02,1.45,tc.z),vec3(0.17,1.45,0.17),13.0);\n    vec2 bounds=boxInterval(ro,rd,tc+vec3(0.0,-0.10,0.0),vec3(0.95,1.95,1.05));\n    if(bounds.x\u003cbounds.y && bounds.x\u003ch.t && bounds.y>0.0) {\n        float t=max(bounds.x,0.0),endT=min(bounds.y,h.t);\n        for(int i=0;i\u003c52;i++) {\n            vec3 p=ro+rd*t;float d=tree(p);\n            if(d\u003c0.006) { h=Hit(t,treeNormal(p),11.0);break; }\n            t+=max(d*0.62,0.005);\n            if(t>endT)break;\n        }\n    }\n    // Restrict the expensive anatomical evaluator to the actual cattle bounds.\n    bounds=boxInterval(ro,rd,vec3(-0.55,1.58,0.0),vec3(3.05,1.66,1.02));\n    if(bounds.x\u003cbounds.y && bounds.x\u003ch.t && bounds.y>0.0) {\n        float t=max(bounds.x,0.0),endT=min(bounds.y,h.t);\n        for(int i=0;i\u003cCOW_STEPS;i++) {\n            vec3 p=ro+rd*t;vec2 d=cow(p);\n            float eps=max(0.0008,t*0.00006);\n            if(d.x\u003ceps) { h=Hit(t,cowNormal(p,eps*0.9),d.y);break; }\n            t+=max(d.x*0.82,0.0005);\n            if(t>endT)break;\n        }\n    }\n    O=vec4(encodeNormal(h.n),h.t,h.m);\n}\n"},{"inputs":[{"id":"XsXGR8","filepath":"/media/previz/buffer01.png","type":"buffer","channel":0,"sampler":{"filter":"nearest","wrap":"clamp","vflip":"true","srgb":"false","internal":"byte"},"published":1},{"id":"4dXGR8","filepath":"/media/previz/buffer00.png","type":"buffer","channel":1,"sampler":{"filter":"linear","wrap":"clamp","vflip":"true","srgb":"false","internal":"byte"},"published":1}],"outputs":[{"id":"4sXGR8","channel":0}],"name":"Buffer C","description":"Deferred pigment materials, soft shadows and atmospheric light","type":"buffer","code":"// Deferred painting: pigments, hair, foliage, thatch, sky and soft lighting.\n// iChannel0: geometry B. iChannel1: pigment/camera A.\n// Palettes are written in sRGB the way they were read off the painting, then linearised.\nvec3 srgb(vec3 c) { return pow(c,vec3(2.2)); }\nfloat texNoise(vec2 q) { return pigment(iChannel1,q).g; }\nfloat grain3(vec3 p,vec3 n,float scale) {\n    vec3 w=pow(abs(n),vec3(5.0));w/=max(dot(w,vec3(1)),0.001);\n    return dot(w,vec3(pigment(iChannel1,p.yz*scale).g,\n                      pigment(iChannel1,p.xz*scale).g,\n                      pigment(iChannel1,p.xy*scale).g));\n}\nfloat fbm2(vec2 p) {\n    return 0.5*pigment(iChannel1,p*0.11).r+0.3*pigment(iChannel1,p*0.23+0.37).g+0.2*pigment(iChannel1,p*0.61+0.71).g;\n}\n// The sky, read directly in painting pixels (800x668 reference, y down): teal-green overhead, a large\n// warm cumulus with its sunlit shoulder near the tree, a grey-lilac cloud floor, then pale hills.\nvec3 paintSky(vec2 sp) {\n    float n0=pigment(iChannel1,sp*0.0021+vec2(0.31,0.07)).r;\n    float n1=pigment(iChannel1,sp*0.0052+vec2(0.11,0.43)).g;\n    float n2=pigment(iChannel1,sp*0.0135+vec2(0.71,0.29)).g;\n    float wob=(n0-0.5)*46.0+(n1-0.5)*22.0;\n    vec2 q=sp+vec2(wob,wob*0.7);\n    // Cloud mass: a big billow, its sunlit lobe, a second shoulder and a low bank running to the horizon.\n    float bank=smoothstep(150.0,250.0,q.y-0.06*(q.x-120.0))*0.85;\n    float billow=1.0-smoothstep(0.35,1.0,length((q-vec2(178.0,182.0))/vec2(135.0,92.0)));\n    float lobe=1.0-smoothstep(0.30,1.0,length((q-vec2(210.0,140.0))/vec2(70.0,54.0)));\n    float side=1.0-smoothstep(0.30,1.0,length((q-vec2(86.0,196.0))/vec2(80.0,46.0)));\n    float cloud=sat(max(max(bank,billow*1.1),max(lobe*1.2,side*0.95))+0.34*(n1-0.5)+0.18*(n2-0.5));\n    cloud=smoothstep(0.22,0.80,cloud);\n    vec3 teal=mix(srgb(vec3(0.53,0.65,0.49)),srgb(vec3(0.66,0.73,0.53)),smoothstep(0.0,190.0,sp.y)*0.9+0.12*n1);\n    teal=mix(teal,srgb(vec3(0.60,0.68,0.50)),(1.0-smoothstep(-40.0,60.0,sp.x))*0.5);\n    // Sunlit warm cream on the right/upper side of the billows, cooler grey-lilac underneath.\n    float lit=sat(0.55+0.55*((q.x-140.0)/200.0)-0.55*((q.y-150.0)/170.0)+0.35*(n2-0.5));\n    vec3 cream=mix(srgb(vec3(0.70,0.655,0.50)),srgb(vec3(0.90,0.79,0.50)),lit);\n    cream=mix(cream,srgb(vec3(0.80,0.76,0.56)),0.55*bank*(1.0-billow));\n    float floorShade=smoothstep(215.0,345.0,sp.y);\n    cream=mix(cream,srgb(vec3(0.66,0.635,0.50)),floorShade*0.9);\n    vec3 sky=mix(teal,cream,cloud);\n    // Low, pale hills at the horizon (y ~ 352..362), lost in haze toward the right.\n    float ridge=354.0+4.0*sin(sp.x*0.021+1.3)+2.5*sin(sp.x*0.057)+2.5*(n2-0.5);\n    float hills=smoothstep(ridge-5.0,ridge+5.0,sp.y);\n    sky=mix(sky,srgb(vec3(0.63,0.60,0.42)),hills*0.75);\n    // Three distant birds, dark flecks in the teal above the billow.\n    vec2 bp[3]; bp[0]=vec2(108.0,93.0); bp[1]=vec2(125.0,118.0); bp[2]=vec2(155.0,130.0);\n    for(int i=0;i\u003c3;i++) {\n        vec2 d=(sp-bp[i])/vec2(6.0,3.0);\n        float wing=abs(d.y+abs(d.x)*0.9-0.2*sqrt(abs(d.x)+0.001));\n        sky=mix(sky,srgb(vec3(0.20,0.24,0.20)),(1.0-smoothstep(0.14,0.30,wing))*step(abs(d.x),1.0));\n    }\n    return sky;\n}\nfloat cattleShadow(vec3 p,vec3 light) {\n    if(abs(p.x)>9.0 || p.z\u003c-5.0 || p.y>3.4) return 1.0;\n    float t=0.05,s=1.0;\n    for(int i=0;i\u003cSHADOW_STEPS;i++) {\n        float d=cowMass(p+light*t);\n        s=min(s,5.0*max(d,0.0)/t);\n        if(d\u003c0.001)return 0.0;\n        t+=clamp(d,0.035,0.45);\n        if(t>7.0)break;\n    }\n    return sat(s);\n}\nfloat cattleAO(vec3 p,vec3 n) {\n    float a=0.0,weight=1.0,dist=0.09;\n    for(int k=0;k\u003c4;k++) {\n        float d=cowMass(p+n*dist);\n        a+=max(0.0,dist-d)*weight;\n        dist+=0.16;weight*=0.53;\n    }\n    return sat(1.0-1.3*a);\n}\nvec3 bumpNormal(vec3 n,vec3 p,float height,float strength) {\n    vec3 dx=dFdx(p),dy=dFdy(p);\n    vec3 r1=cross(dy,n),r2=cross(n,dx);\n    float det=dot(dx,r1);\n    vec3 grad=(dFdx(height)*r1+dFdy(height)*r2)/max(abs(det),0.000001)*sign(det);\n    return normalize(n-clamp(grad,vec3(-5),vec3(5))*strength);\n}\n// Bristle dashes laid on a surface, in world units. The pattern is a property of the paint on the object,\n// so it moves, foreshortens and occludes with it. Each dash fades to its average (zero) once it becomes\n// thinner than a pixel, so distant or grazing surfaces do not shimmer while the camera orbits.\nfloat dashes(vec2 q,float cell,float seed,float ang,float spread,float len,float wid,float density) {\n    float fw=max(length(dFdx(q)),length(dFdy(q)));\n    float lod=1.0-smoothstep(0.6,1.4,fw/wid);\n    if(lod\u003c=0.0) return 0.0;\n    float acc=0.0;\n    vec2 g=floor(q/cell);\n    for(int j=-1;j\u003c=1;j++) for(int i=-1;i\u003c=1;i++) {\n        vec2 id=g+vec2(float(i),float(j));\n        vec3 r=vec3(hash12(id+seed),hash12(id+seed+17.0),hash12(id+seed+41.0));\n        if(r.z>density) continue;\n        vec2 c=(id+0.15+0.7*r.xy)*cell;\n        vec2 d=rot(ang+(r.x-0.5)*spread)*(q-c);\n        float along=1.0-smoothstep(len*0.55,len,abs(d.x));\n        float across=1.0-smoothstep(wid,wid*2.0,abs(d.y+(r.y-0.5)*0.5*d.x*d.x/len));\n        acc+=(r.y>0.46?1.0:-1.0)*along*across*(0.55+0.45*r.z/density);\n    }\n    return clamp(acc,-1.0,1.0)*lod;\n}\n// Fine dry-brush tooth on a surface: value noise in world space, band-limited by the pixel footprint.\nfloat tooth(vec3 p,vec3 n,float freq) {\n    vec3 w=pow(abs(n),vec3(4.0)); w/=dot(w,vec3(1));\n    float fw=length(fwidth(p))*freq;\n    float v=w.z*noise2(p.xy*freq)+w.x*noise2(p.zy*freq+7.1)+w.y*noise2(p.xz*freq+3.7);\n    return (v-0.5)*(1.0-smoothstep(0.35,0.9,fw));\n}\nfloat straw(vec2 p) {\n    float aa=clamp(3.4*max(length(dFdx(p)),length(dFdy(p))),0.004,0.25);\n    vec2 cell=floor(p*3.4),q=fract(p*3.4)-0.5;\n    float angle=hash12(cell)*6.283;\n    q=rot(angle)*q;\n    float d=length(vec2(max(abs(q.x)-0.24,0.0),q.y));\n    float width=0.010;\n    return (1.0-smoothstep(width,width+aa*0.7,d))*min(1.0,width/max(aa*0.40,0.001))*step(0.52,hash12(cell+47.0));\n}\nvoid mainImage(out vec4 O,in vec2 F) {\n    if(!isReady(iChannel0,62.25)||!isReady(iChannel1,61.25)) { O=vec4(0);return; }\n    if(all(equal(ivec2(F),  iChannel1: geometry B. iChannel2: pigment A.\nvec3 painted(vec2 uv,vec2 pixel) {\n    vec3 center=textureLod(iChannel0,uv,0.0).rgb;\n    float depth=textureLod(iChannel1,uv,0.0).b;\n    float material=textureLod(iChannel1,uv,0.0).a;\n    float radius=mix(1.55,2.15,step(10.5,material));\n    vec3 m0=vec3(0),m1=vec3(0),m2=vec3(0),m3=vec3(0);\n    vec4 variance=vec4(0),weight=vec4(0);\n    // Four overlapping quadrants reuse the same 25 fetches, no dynamic arrays.\n    for(int y=-2;y\u003c=2;y++)for(int x=-2;x\u003c=2;x++) {\n        vec2 off=vec2(float(x),float(y))*pixel*radius*0.5;\n        vec2 at=clamp(uv+off,pixel*2.5,1.0-pixel*1.5);\n        vec3 c=textureLod(iChannel0,at,0.0).rgb;\n        float z=textureLod(iChannel1,at,0.0).b;\n        float w=exp(-abs(z-depth)*9.0)*exp(-float(x*x+y*y)*0.14);\n        float v=luminance(c);v*=v;\n        if(x\u003c=0 && y\u003c=0) {m0+=c*w;variance.x+=v*w;weight.x+=w;}\n        if(x>=0 && y\u003c=0) {m1+=c*w;variance.y+=v*w;weight.y+=w;}\n        if(x>=0 && y>=0) {m2+=c*w;variance.z+=v*w;weight.z+=w;}\n        if(x\u003c=0 && y>=0) {m3+=c*w;variance.w+=v*w;weight.w+=w;}\n    }\n    weight=max(weight,0.001);\n    m0/=weight.x;m1/=weight.y;m2/=weight.z;m3/=weight.w;\n    vec4 means=vec4(luminance(m0),luminance(m1),luminance(m2),luminance(m3));\n    variance=max(variance/weight-means*means,0.0);\n    vec4 certainty=1.0/(1.0+sq(250.0)*variance*variance);\n    vec3 smoothColor=(m0*certainty.x+m1*certainty.y+m2*certainty.z+m3*certainty.w)/dot(certainty,vec4(1));\n    float protect=(material>5.5 && material\u003c10.5)?0.35:((material>0.5 && material\u003c1.5)?0.30:0.75);\n    return mix(center,smoothColor,PAINT_AMOUNT*protect);\n}\n// Near-identity tone curve with a soft knee: palettes are authored in display values, so only the\n// brightest highlights are rolled off (on the largest channel, which keeps their hue).\nvec3 filmic(vec3 c) {\n    c*=EXPOSURE;\n    float m=max(c.r,max(c.g,c.b)),k=0.80;\n    float s=m\u003ck?1.0:(k+(1.0-k   : { internal: gl.RGBA16F, type: gl.HALF_FLOAT };

const HEADER = `#version 300 es
#ifdef GL_ES
precision highp float;
precision highp int;
precision mediump sampler3D;
#endif
#define HW_PERFORMANCE 1
uniform vec3 iResolution;
uniform float iTime;
uniform float iChannelTime[4];
uniform vec4 iMouse;
uniform vec4 iDate;
uniform float iSampleRate;
uniform vec3 iChannelResolution[4];
uniform int iFrame;
uniform float iTimeDelta;
uniform float iFrameRate;

uniform sampler2D iChannel2;

const HEADER_LINES = HEADER.split('\n').length - 1;

const VS = `#version 300 es
in vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }`;

let state = null;   // { passes, targets, ... }
let time = 0, frame = 0, playing = !manual, lastNow = 0, fpsAcc = 0, fpsN = 0, fps = 0;

function compile(type, src, label, commonLines) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {

    // Map line numbers back to the pass (or Common) source.
    const mapped = log.replace(/ERROR: 0:(\d+):/g, (_, n) => {
      let line = +n - HEADER_LINES;
      if (line <= commonLines) return `ERROR: Common:${line}:`;
      return `ERROR: ${label}:${line - commonLines}:`;

    throw new Error(`[${label}] compile failed\n${mapped}`);

function program(fsSrc, label, commonLines) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VS, 'vertex', 0));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc, label, commonLines));

function makeTarget(w, h) {
  const t = gl.createTexture();

  const levels = 1 + Math.floor(Math.log2(Math.max(w, h)));
  gl.texStorage2D(gl.TEXTURE_2D, levels, FMT.internal, w, h);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);

  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);

// Media textures: only what the page embeds (e.g. a stand-in font atlas).
const MEDIA = JSON.parse(document.getElementById('media-json').textContent) || {};

  gl.bindTexture(gl.TEXTURE_2D, t.tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(4));

    gl.bindTexture(gl.TEXTURE_2D, t.tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, sampler && sampler.vflip === 'true');

function load(json) {

}

function resize() {

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round((params.get('w') || canvas.clientWidth * dpr) * (params.get('w') ? 1 : scale)));

      gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, state.targets[b][0].fb);

    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);

function restart() {
  time = 0; frame = 0;
  if (!state) return;
  freeTargets();
  state.w = state.h = 0;
  resize();
}

const quad = gl && gl.createBuffer();
if (gl) {

  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
}

  if (!state) return;

  const now = new Date();
  const date = [now.getFullYear(), now.getMonth(), now.getDate(),
                now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds() + now.getMilliseconds() / 1000];
  for (const pass of state.passes) {
    if (only && !only.includes(pass.name)) continue;
    const { p, u } = pass.prog;
    gl.useProgram(p);
    const texUnits = [];
    for (let ch = 0; ch < 4; ch++) {
      const inp = pass.inputs.find((i) => i.channel === ch);
      gl.activeTexture(gl.TEXTURE0 + ch);
      if (inp && inp.texture) {
        gl.bindTexture(gl.TEXTURE_2D, inp.texture.tex);
        gl.bindSampler(ch, inp.sampler);
        texUnits.push(inp.texture.w, inp.texture.h, 1);
      } else if (inp && inp.buffer !== null) {
        const b = inp.buffer;
        gl.bindTexture(gl.TEXTURE_2D, state.targets[b][state.cur[b]].t);
        gl.bindSampler(ch, inp.sampler);
        texUnits.push(w, h, 1);
      } else {
        gl.bindTexture(gl.TEXTURE_2D, null);
        gl.bindSampler(ch, null);
        texUnits.push(0, 0, 0);
      }
      gl.uniform1i(u['iChannel' + ch], ch);
    }
    gl.uniform3f(u.iResolution, w, h, 1);
    gl.uniform1f(u.iTime, time);
    gl.uniform1f(u.iTimeDelta, dt);
    gl.uniform1f(u.iFrameRate, dt > 0 ? 1 / dt : 60);
    gl.uniform1i(u.iFrame, frame);
    gl.uniform4f(u.iMouse, mouse[0], mouse[1], mouse[2], mouse[3]);
    gl.uniform4f(u.iDate, date[0], date[1], date[2], date[3]);
    gl.uniform1f(u.iSampleRate, 44100);
    gl.uniform3fv(u.iChannelResolution, texUnits);
    gl.uniform1fv(u.iChannelTime, [time, time, time, time]);
    let dst = null;
    if (pass.target >= 0) {
      const b = pass.target;
      const next = 1 - state.cur[b];
      dst = state.targets[b][next];
      gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb);
    } else {
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    }
    gl.viewport(0, 0, w, h);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (pass.target >= 0) {
      const b = pass.target;
      state.cur[b] = 1 - state.cur[b];
      if (state.mipBuffers.has(b)) {
        gl.bindTexture(gl.TEXTURE_2D, dst.t);
        gl.generateMipmap(gl.TEXTURE_2D);
      }
    }
  }
  for (let ch = 0; ch < 4; ch++) gl.bindSampler(ch, null);
  frame++;
  time += dt;
  if (mouse[3] > 0) mouse[3] = -mouse[3];
}

function tick(nowMs) {
  const now = nowMs / 1000;
  const dt = lastNow ? Math.min(now - lastNow, 0.1) : 1 / 60;
  lastNow = now;
  if (playing) {
    try { renderFrame(dt); } catch (e) { fail(String(e)); playing = false; }
    fpsAcc += dt; fpsN++;
    if (fpsAcc > 0.5) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
  }
  document.getElementById('stats').textContent =
    `${time.toFixed(2)}s  ${fps.toFixed(0)} fps  ${canvas.width}×${canvas.height}`;
  requestAnimationFrame(tick);
}

// Shadertoy mouse convention: xy = current position while held, zw = click
// position; z < 0 after release, w < 0 after the click frame.
function setMouse(x, y, down) {
  if (down && !mouseDown) { mouse[2] = x; mouse[3] = y; }
  if (down) { mouse[0] = x; mouse[1] = y; }
  if (!down && mouseDown) { mouse[2] = -Math.abs(mouse[2]); }
  mouseDown = down;
}
function canvasPos(e) {
  const r = canvas.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width * canvas.width, (1 - (e.clientY - r.top) / r.height) * canvas.height];
}
canvas.addEventListener('pointerdown', (e) => { canvas.setPointerCapture(e.pointerId); setMouse(...canvasPos(e), true); });
canvas.addEventListener('pointermove', (e) => { if (mouseDown) setMouse(...canvasPos(e), true); });
canvas.addEventListener('pointerup', (e) => setMouse(...canvasPos(e), false));

const playBtn = document.getElementById('play');
function setPlaying(v) { playing = v; playBtn.textContent = v ? '❚❚' : '▶'; }
playBtn.onclick = () => setPlaying(!playing);
document.getElementById('restart').onclick = restart;
document.getElementById('scale').onchange = () => { if (state) resize(); };
document.getElementById('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
document.getElementById('file').onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  try { load(JSON.parse(await f.text())); } catch (err) { fail(String(err)); }
};
window.addEventListener('keydown', (e) => {
  if (e.key === ' ') { setPlaying(!playing); e.preventDefault(); }
  else if (e.key === 'r' || e.key === 'R') restart();
  else if (e.key === 'f' || e.key === 'F') document.getElementById('fs').click();
});
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', async (e) => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f) try { load(JSON.parse(await f.text())); } catch (err) { fail(String(err)); }
});
let idleTimer = 0;
window.addEventListener('pointermove', () => {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add('idle'), 2500);
});

// Hooks for automated rendering (used by tools/render.mjs with ?manual).
window.ST = {
  renderFrames(n, dt = 1 / 60, only) { for (let i = 0; i < n; i++) renderFrame(dt, only); gl.finish(); return { time, frame }; },
  setMouse, restart, load,
  readBuffer(b, x, y, w, h) {
    const t = state.targets[b][state.cur[b]];
    gl.bindFramebuffer(gl.FRAMEBUFFER, t.fb);
    const out = new Float32Array(w * h * 4);
    gl.readPixels(x, y, w, h, gl.RGBA, gl.FLOAT, out);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return Array.from(out);
  },
  get time() { return time; }, get frame() { return frame; },
  errors: () => errBox.textContent,
  mediaReady: () => Object.values(mediaCache).every((t) => t.ready),
};

if (gl) {
  const embedded = JSON.parse(document.getElementById('shader-json').textContent);
  if (embedded) { try { load(embedded); } catch (e) { fail(String(e)); } }
  if (!manual) requestAnimationFrame(tick);
  if (manual) document.getElementById('bar').style.display = 'none';
}
</script>
</body>
</html>
